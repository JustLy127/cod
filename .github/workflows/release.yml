name: Build and release Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        # https://github.com/actions/checkout/releases/tag/v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check release version
        run: |
          $metadata = Get-Content -LiteralPath package-manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne ('v' + $metadata.packageVersion)) {
            throw 'The tag must match package-manifest.json packageVersion.'
          }

      - name: Prepare dependencies and build
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Run launcher self-tests
        run: |
          $process = Start-Process -FilePath .\FoxSpiritCodexBoot\FoxSpiritCodexBoot.exe -ArgumentList '--self-test' -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw 'Launcher self-tests failed.' }
          $result = Get-Content -LiteralPath .\FoxSpiritCodexBoot\qa\self-test.json -Raw | ConvertFrom-Json
          if (!$result.ok) { throw 'Launcher verification did not pass.' }

      - name: Check theme and updater syntax
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('TushanSusuTheme/compat/loader.mjs','TushanSusuTheme/compat/modern-appearance.js')) {
            & .\tools\node\node.exe --check $file
            if ($LASTEXITCODE -ne 0) { throw ('Theme syntax check failed: ' + $file) }
          }
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Update-Theme.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Package clean Windows distribution
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\Package.ps1 -OutputDirectory dist
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($archives.Count -eq 0) { throw 'No install package was produced.' }
          foreach ($archive in $archives) {
            $digest = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText($archive.FullName + '.sha256', $digest + '  ' + $archive.Name + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
          }

      - name: Save install package
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cod-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Download verified build artifact
        # https://github.com/actions/download-artifact/releases/tag/v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cod-windows-x64
          path: dist

      - name: Publish tag release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH format.'
          }
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($archives.Count -eq 0) { throw 'No install package was downloaded.' }
          $assets = @()
          foreach ($archive in $archives) {
            $checksumPath = $archive.FullName + '.sha256'
            if (!(Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw 'Missing archive checksum.' }
            $expected = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+', 2)[0]
            if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash -ine $expected) {
              throw 'Archive checksum did not match.'
            }
            $assets += $archive.FullName
            $assets += $checksumPath
          }
          # The create command rejects an existing release. Avoid using an
          # expected "not found" stderr response as a PowerShell 5.1 probe.
          $notes = "Windows x64 complete package. New installs: extract and run Install.cmd. Existing installs: fully exit Codex, extract this release to a separate temporary folder, and run Update-Theme.cmd to update the original installation. See the README for Chinese instructions."
          $notesPath = Join-Path $env:RUNNER_TEMP 'cod-release-notes.txt'
          [IO.File]::WriteAllText($notesPath, $notes, (New-Object Text.UTF8Encoding($false)))
          & gh release create $env:RELEASE_TAG @assets --repo $env:GH_REPO --verify-tag --title ('cod ' + $env:RELEASE_TAG) --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
